[package]
name = "central_e2ee_chat"
version = "0.3.0"
edition = "2024"

[[bin]]
name = "server"
path = "server.rs"

[[bin]]
name = "client"
path = "client.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.22.1"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.12.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[profile.dev]
debug = 0
strip = "symbols"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 0
strip = "symbols"
incremental = false
debug-assertions = false
overflow-checks = false
